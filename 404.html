<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>הדף לא נמצא - היום ומחר</title>
<link rel="icon" type="image/png" sizes="192x192" href="/tzofen/icon4-192.png">
<style>
/* GitHub Pages serves this file for any unknown path, so every link here is absolute (/tzofen/...). */
:root{color-scheme:light dark;--bg:#f2f2ee;--surface:#fff;--line:#e1e1db;--ink:#17181a;--ink-2:#45474c;--mark:#f4b41a}
@media (prefers-color-scheme:dark){:root{--bg:#101113;--surface:#1b1c1f;--line:#2e3034;--ink:#f0f0ec;--ink-2:#c2c3be}}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,"Segoe UI",Arial,sans-serif}
main{box-sizing:border-box;max-width:440px;margin:0 auto;padding:18vh 20px 40px}
.card{padding:24px 22px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
h1{margin:0 0 8px;font-size:1.5rem;font-weight:600}
p{margin:0 0 20px;color:var(--ink-2)}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 18px;border-radius:10px;background:var(--mark);color:#17181a;font-weight:600;text-decoration:none}
a.btn:focus-visible{outline:2.5px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>הדף הזה לא נמצא</h1>
    <p>אולי הקישור השתנה או שנפלה בו טעות. הלו"ז של צופן נמצא בכתובת הרגילה.</p>
    <a class="btn" href="/tzofen/">חזרה להיום ומחר</a>
  </div>
</main>
</body>
</html>
